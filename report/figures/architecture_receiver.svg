<polyline class="" points="880,185 930,185" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-ccb69015)"/>
<polyline class="" points="760,265 760,330" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-ccb69015)"/>
<polyline class="" points="575,410 640,410" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-ccb69015)"/>
<polyline class="" points="880,410 930,410" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-ccb69015)"/>
<polyline class="" points="680,490 680,525 140,525 140,455" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-ccb69015)"/>
<text x="34" y="553" font-family="Arial, sans-serif" font-size="15" fill="#147d69" font-weight="700">Only selected state is committed</text>
<polyline class="learning" points="1045,490 1045,620 880,620" fill="none" stroke="#ad5b16" stroke-width="2.3" stroke-dasharray="6" marker-end="url(#arrow-ccb69015)"/>
<polyline class="learning" points="450,565 450,490" fill="none" stroke="#ad5b16" stroke-width="2.3" stroke-dasharray="6" marker-end="url(#arrow-ccb69015)"/>
<polyline class="learning" points="735,565 900,565 900,285 755,285 755,265" fill="none" stroke="#ad5b16" stroke-width="2.3" stroke-dasharray="6" marker-end="url(#arrow-ccb69015)"/>
<text x="34" y="722" font-family="Arial, sans-serif" font-size="16" fill="#5a6779" font-weight="400">Blue: event computation    Green: persistent state    Orange dashed: learning-only signals</text>
<text x="34" y="754" font-family="Arial, sans-serif" font-size="16" fill="#25354b" font-weight="400">Standard training evaluates U proposals; cached winner-only inference evaluates one selected proposal.</text>
<text x="34" y="784" font-family="Arial, sans-serif" font-size="16" fill="#5a6779" font-weight="400">Trained FP32 sparse parity/cost pending. Stored-key read precedes input-conditioned age evolution.</text>
</svg>
