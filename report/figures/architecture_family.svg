<text x="35" y="435" font-family="Arial, sans-serif" font-size="19" fill="#147d69" font-weight="700">Implemented family branches (different learning and validation scopes)</text>
<g class=""><rect x="35" y="470" width="360" height="150" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="497" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Timing logic + statistics</text>
<text x="49" y="523" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">order / phase / finite rules</text>
<text x="49" y="546" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">context counts, copy and backoff</text>
<text x="49" y="569" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">event topology or addressed tables</text>
</g>
<g class=""><rect x="420" y="470" width="360" height="150" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="434" y="497" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Carriers + modal encoders</text>
<text x="434" y="523" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">shared event / SSM-like state</text>
<text x="434" y="546" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">selective temporal carriers</text>
<text x="434" y="569" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">dense local maps at supplied events</text>
</g>
<g class=""><rect x="805" y="470" width="360" height="150" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="819" y="497" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Native receiver stacks</text>
<text x="819" y="523" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">private pools + hard state commits</text>
<text x="819" y="546" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">parallel heads + temporal joins</text>
<text x="819" y="569" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">sparse selected work; paid candidates</text>
</g>
<g class=""><rect x="35" y="665" width="360" height="150" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="692" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Historical / outcome memory</text>
<text x="49" y="718" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">episodic key/value bank and indexing</text>
<text x="49" y="741" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">protected outcomes; delayed taps</text>
<text x="49" y="764" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">bilinear queries; historical credit</text>
</g>
<g class=""><rect x="420" y="665" width="360" height="150" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="434" y="692" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Count / learned-memory hybrids</text>
<text x="434" y="718" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">native stack + statistical cascade</text>
<text x="434" y="741" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">learned keys + count-valued receivers</text>
<text x="434" y="764" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">mixture or sampled/top write variants</text>
</g>
<g class=""><rect x="805" y="665" width="360" height="150" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="819" y="692" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Attention / richer reception</text>
<text x="819" y="718" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Transformer import and race delivery</text>
<text x="819" y="741" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">exact delay-coded attention identity</text>
<text x="819" y="764" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">windows / popcorn: partial integration</text>
</g>
<g class=""><rect x="35" y="875" width="1130" height="170" rx="12" fill="white" stroke="#ad5b16" stroke-width="2"/>
<text x="49" y="902" font-family="Arial, sans-serif" font-size="17" fill="#ad5b16" font-weight="700">System composition: choose and connect the required modules</text>
<text x="49" y="928" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">A stack + evidence memory + reception policy + query/readout + learning algorithm.</text>
<text x="49" y="951" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Learned content changes time/routes; chosen time/routes change content and persistent future evidence.</text>
<text x="49" y="974" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Inference, counterfactual learning, optimizer, scheduling, storage and communication have separate costs.</text>
<text x="49" y="997" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Shared rules with private facts can scale useful state; actual cross-source grounding needs an information path.</text>
</g>
