<rect width="1200" height="1160" fill="#fafcff"/>
<text x="34" y="44" font-family="Arial, sans-serif" font-size="26" fill="#162235" font-weight="700">0. The whole family: shared toolbox, distinct constructions</text>
<text x="34" y="76" font-family="Arial, sans-serif" font-size="16" fill="#5a6779" font-weight="400">Compositions reuse primitives; no single completed model combines and validates every branch below.</text>
<g class=""><rect x="35" y="115" width="1130" height="105" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="142" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Observed events: address + arrival time + content</text>
<text x="49" y="168" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Tokens, sensor marks, counts and query/action requests need declared causal adapters.</text>
<text x="49" y="191" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Input precision and packetization set the available information before any layer learns.</text>
</g>
<g class=""><rect x="35" y="280" width="218" height="112" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="307" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Timing logic</text>
<text x="49" y="333" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">delay; first-of / latest-of</text>
<text x="49" y="356" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">coincidence; hold; veto</text>
</g>
