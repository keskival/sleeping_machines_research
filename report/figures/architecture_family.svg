<text x="35" y="1100" font-family="Arial, sans-serif" font-size="18" fill="#2259a7" font-weight="700">Review every level on: computational capacity/work | representational capacity | trainability.</text>
<text x="35" y="1132" font-family="Arial, sans-serif" font-size="16" fill="#5a6779" font-weight="400">Known primitives are attributed. The research contribution is their construction and tested consequences.</text>
