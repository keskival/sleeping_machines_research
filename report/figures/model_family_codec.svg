<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-label="Opportunity: learned asynchronous communication and memory">
<defs><marker id="arrow-0ccd8ded" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="670" fill="#fafcff"/>
<text x="34" y="44" font-family="Arial, sans-serif" font-size="26" fill="#162235" font-weight="700">Opportunity: learned asynchronous communication and memory</text>
<text x="34" y="78" font-family="Arial, sans-serif" font-size="17" fill="#5a6779" font-weight="400">Proposed composition, not a trained codec or a measured bitrate advantage.</text>
<g class=""><rect x="30" y="115" width="245" height="145" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="44" y="142" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Causal observations</text>
<text x="44" y="168" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Irregular events or frames</text>
<text x="44" y="191" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Typed content / address / time</text>
<text x="44" y="214" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Only available source history</text>
</g>
<g class=""><rect x="320" y="115" width="245" height="145" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="334" y="142" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Sender state + policy</text>
<text x="334" y="168" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">What to retain and retrieve</text>
<text x="334" y="191" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">What / where / when to send</text>
<text x="334" y="214" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Fast state; slow learned rules</text>
</g>
<g class=""><rect x="610" y="115" width="245" height="145" rx="12" fill="white" stroke="#ad5b16" stroke-width="2"/>
<text x="624" y="142" font-family="Arial, sans-serif" font-size="17" fill="#ad5b16" font-weight="700">Quantized wire format</text>
<text x="624" y="168" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Codes, addresses and times</text>
<text x="624" y="191" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Entropy / framing / reset bits</text>
<text x="624" y="214" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Count actual serialized bytes</text>
</g>
<g class=""><rect x="900" y="115" width="270" height="145" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="914" y="142" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Receiver state</text>
<text x="914" y="168" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Update from received history</text>
<text x="914" y="191" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Predict between messages</text>
<text x="914" y="214" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">No access to unsent facts</text>
</g>
<polyline class="" points="275,185 314,185" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-0ccd8ded)"/>
<polyline class="" points="565,185 604,185" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-0ccd8ded)"/>
<polyline class="" points="855,185 894,185" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-0ccd8ded)"/>
<g class=""><rect x="30" y="315" width="535" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="44" y="342" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Variable activity is a design choice</text>
<text x="44" y="368" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Wait when receiver predicts; send useful changes.</text>
<text x="44" y="391" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Cadence, message count, bits and work are separate.</text>
</g>
<g class=""><rect x="610" y="315" width="560" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="624" y="342" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Fixed reconstruction or task queries</text>
<text x="624" y="368" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Same query cutoffs, coverage, deadlines and declared fallback.</text>
<text x="624" y="391" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">A task-sufficient feature stream may not reconstruct the source.</text>
</g>
<polyline class="" points="1035,260 1035,309" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-0ccd8ded)"/>
<g class=""><rect x="30" y="495" width="1140" height="120" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="44" y="522" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Learn from future usefulness and complete resource cost</text>
<text x="44" y="548" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Objective: query distortion/task loss + transmitted bits + sender/receiver work + lateness.</text>
<text x="44" y="571" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Continuous credit plus useful alternative send/wait, write, retention and timing consequences.</text>
<text x="44" y="594" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Meta-learning analogy: fast evidence/parameters; slow rules that learn how to update and communicate.</text>
</g>
<polyline class="" points="890,435 890,489" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-0ccd8ded)"/>
<polyline class="" points="442,495 442,441 585,441 585,96 442,96 442,109" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="6" marker-end="url(#arrow-0ccd8ded)"/>
<text x="34" y="651" font-family="Arial, sans-serif" font-size="16" fill="#5a6779" font-weight="400">Encoder/decoder agreement, side information and training work belong in the contract.</text>
</svg>