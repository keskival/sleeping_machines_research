<g class=""><rect x="190" y="450" width="820" height="135" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="204" y="477" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Explicit shared information paths + persistent world state</text>
<text x="204" y="503" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Private facts / learned vectors / causal statistics / historical evidence</text>
<text x="204" y="526" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Cross-source receivers or retrieval let modalities inform the same query.</text>
<text x="204" y="549" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Shared parameters alone do not share facts.</text>
</g>
<g class=""><rect x="35" y="640" width="550" height="122" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="667" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Selective temporal region</text>
<text x="49" y="693" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Addressed state programs; learned clocks and routes</text>
<text x="49" y="716" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Small messages; local timers, joins and deadlines</text>
<text x="49" y="739" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">No required global periodic sweep</text>
</g>
<g class=""><rect x="615" y="640" width="550" height="122" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="629" y="667" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Rich interaction where needed</text>
<text x="629" y="693" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Multiple deliveries, exact aggregation or dense island</text>
<text x="629" y="716" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Wider state/message only at a diagnosed bottleneck</text>
<text x="629" y="739" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Pay its full key/value, learning and traffic cost</text>
</g>
