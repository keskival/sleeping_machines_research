<text x="204" y="847" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Queries, predictions and actions</text>
<text x="204" y="873" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Regular readouts or event-triggered decisions over shared causal evidence</text>
<text x="204" y="896" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Preserve state across arrivals; supervise useful factual and alternative consequences</text>
</g>
<polyline class="" points="310,762 310,790 600,790 600,820" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-0b016961)"/>
