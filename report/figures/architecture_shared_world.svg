<text x="34" y="44" font-family="Arial, sans-serif" font-size="26" fill="#162235" font-weight="700">One-model aspiration: mixed arrivals, shared state, local computation</text>
<text x="34" y="76" font-family="Arial, sans-serif" font-size="16" fill="#5a6779" font-weight="400">Input density, computation density, arrival cadence and hardware clocking are independent axes.</text>
<g class=""><rect x="35" y="120" width="360" height="100" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="147" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Dense periodic frames</text>
<text x="49" y="173" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">regular arrival; many pixels</text>
</g>
<g class=""><rect x="35" y="268" width="360" height="100" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="295" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Causal modality adapter</text>
<text x="49" y="321" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">preserve relevant evidence</text>
<text x="49" y="344" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">align time/address/reference semantics</text>
</g>
