   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b43" x="61.2" y="67.426406" transform="rotate(-0 61.2 67.426406)">Same goal. A different way to assign learning credit.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(61.2 99.099355)">Ordinary synchronous Transformer training vs the proposed temporal, sparse, learned-credit substrate</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(61.2 112.302363)">Credit tells each component how to change to reduce the prediction loss.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563a6" x="286.35" y="126.495" transform="rotate(-0 286.35 126.495)">STANDARD TRANSFORMER</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087f80" x="776.55" y="126.495" transform="rotate(-0 776.55 126.495)">OUR LEARNED-CREDIT CYCLE</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="286.35" y="180.902461" transform="rotate(-0 286.35 180.902461)">A token batch / context</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="286.35" y="261.983461" transform="rotate(-0 286.35 261.983461)">Forward through dense layers</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(221.916406 278.996375)">Synchronous layer stages</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(190.46875 292.496375)">Keep activations needed for backward</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="286.35" y="373.682461" transform="rotate(-0 286.35 373.682461)">Prediction → observed loss</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="286.35" y="466.103461" transform="rotate(-0 286.35 466.103461)">Backpropagate through the graph</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #546579" x="286.35" y="489.866375" transform="rotate(-0 286.35 489.866375)">Compute exact gradients for this loss</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="286.35" y="568.163461" transform="rotate(-0 286.35 568.163461)">Optimizer updates model weights</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #546579" x="286.35" y="591.926375" transform="rotate(-0 286.35 591.926375)">Then process the next batch</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="776.55" y="180.902461" transform="rotate(-0 776.55 180.902461)">A new event + persistent memory</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="776.55" y="261.983461" transform="rotate(-0 776.55 261.983461)">Timed, addressed forward computation</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(708.410156 279.572156)">Selected state / value work</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(678.65 292.496375)">Produce reusable evidence for learning</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="776.55" y="373.682461" transform="rotate(-0 776.55 373.682461)">Prediction → observed loss</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="776.55" y="466.103461" transform="rotate(-0 776.55 466.103461)">Learned estimator predicts credit</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(675.470313 484.085125)">Forward evidence teaches the estimator</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #546579" transform="translate(669.742188 496.616375)">Sampled exact residuals anchor correction</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172b43" x="776.55" y="568.163461" transform="rotate(-0 776.55 568.163461)">Update model + credit estimator</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #546579" x="776.55" y="591.926375" transform="rotate(-0 776.55 591.926375)">Carry declared state into the next event</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b43" x="64.05" y="631.125" transform="rotate(-0 64.05 631.125)">The intended saving: reuse learned credit instead of recomputing all learning work at every event.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #546579" x="64.05" y="659.475" transform="rotate(-0 64.05 659.475)">Evidence scope: local/deep numerical contracts and measured component savings; the complete sparse, persistent loop is in development.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #546579" x="64.05" y="681.021" transform="rotate(-0 64.05 681.021)">Charge discovery, counterfactuals, teaching, audits, state transport and optimizer work. No general Transformer advantage is claimed here.</text>
   </g>
  </g>
