<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-label="Sleeping Machines in the landscape of model families">
<defs><marker id="arrow-83fff825" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1010" fill="#fafcff"/>
<text x="34" y="44" font-family="Arial, sans-serif" font-size="26" fill="#162235" font-weight="700">Sleeping Machines in the landscape of model families</text>
<text x="34" y="76" font-family="Arial, sans-serif" font-size="15" fill="#5a6779" font-weight="400">A stateful temporal-program envelope; intersections and conditional constructions, not automatic superiority.</text>
<g class=""><rect x="35" y="125" width="360" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="152" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Recurrence / SSMs</text>
<text x="49" y="178" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">State evolution and selective retention</text>
<text x="49" y="201" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Add addressed programs and timed interaction</text>
</g>
<polyline class="" points="215,245 215,295 600,295 600,340" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-83fff825)"/>
<g class=""><rect x="420" y="125" width="360" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="434" y="152" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Attention / Transformers</text>
<text x="434" y="178" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Content-addressed value aggregation</text>
<text x="434" y="201" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Include rich local blocks where needed</text>
</g>
<polyline class="" points="600,245 600,295 600,295 600,340" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-83fff825)"/>
<g class=""><rect x="805" y="125" width="360" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="819" y="152" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Sparse experts / MoE</text>
<text x="819" y="178" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Available capacity beyond selected work</text>
<text x="819" y="201" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Add private facts, clocks and write utility</text>
</g>
<polyline class="" points="985,245 985,295 600,295 600,340" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-83fff825)"/>
<g class=""><rect x="35" y="340" width="1130" height="175" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="367" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">SLEEPING MACHINES: networks of stateful temporal programs</text>
<text x="49" y="393" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">One causal content / time / address / state interface; choose compatible operators at every level.</text>
<text x="49" y="416" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Atoms → units → modules → layers → stacks → memory compositions → learning and serving systems.</text>
<text x="49" y="439" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Selective or full-support regions; local event schedules or synchronous barriers; statistical or learned state.</text>
<text x="49" y="462" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Same structure can support online learning, batching and data-driven design; each needs its own contract.</text>
</g>
<g class=""><rect x="35" y="615" width="360" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="642" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Statistics / retrieval</text>
<text x="49" y="668" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Counts and direct historical evidence</text>
<text x="49" y="691" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Combine with learned shared abstractions</text>
</g>
<polyline class="" points="215,615 215,565 600,565 600,515" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-83fff825)"/>
<g class=""><rect x="420" y="615" width="360" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="434" y="642" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Adaptive memory / TTT</text>
<text x="434" y="668" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Learning inside the deployed model</text>
<text x="434" y="691" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Choose local programs and causal updates</text>
</g>
<polyline class="" points="600,615 600,565 600,565 600,515" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-83fff825)"/>
<g class=""><rect x="805" y="615" width="360" height="120" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="819" y="642" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Event / temporal systems</text>
<text x="819" y="668" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Local arrivals, timers and causal order</text>
<text x="819" y="691" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Combine vectors, races and alternative credit</text>
</g>
<polyline class="" points="985,615 985,565 600,565 600,515" fill="none" stroke="#2259a7" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-83fff825)"/>
<g class=""><rect x="35" y="785" width="1130" height="135" rx="12" fill="white" stroke="#ad5b16" stroke-width="2"/>
<text x="49" y="812" font-family="Arial, sans-serif" font-size="17" fill="#ad5b16" font-weight="700">Distinctive integrated target and economic thesis</text>
<text x="49" y="838" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Computational time + small learned messages + hard selective state + separate keys/values + unrealized credit.</text>
<text x="49" y="861" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Retain useful capacity beyond costly activity; expand rich interaction only where the task requires it.</text>
<text x="49" y="884" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Exact containment needs actual operators, information and schedule. Useful training and lower cost are separate.</text>
</g>
<text x="35" y="960" font-family="Arial, sans-serif" font-size="15" fill="#5a6779" font-weight="400">No required global periodic tick. Current emulators are clocked; hardware energy, general TTT and morphing remain open.</text>
<text x="35" y="988" font-family="Arial, sans-serif" font-size="15" fill="#5a6779" font-weight="400">Known primitives are credited; the proposed contribution is their coherent integration and measured consequences.</text>
</svg>
