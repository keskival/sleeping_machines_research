<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-label="The whole family: local choices become system capabilities through contracts">
<defs><marker id="arrow-8bb1f248" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="1030" fill="#fafcff"/>
<text x="34" y="44" font-family="Arial, sans-serif" font-size="26" fill="#162235" font-weight="700">The whole family: local choices become system capabilities through contracts</text>
<text x="34" y="76" font-family="Arial, sans-serif" font-size="15" fill="#5a6779" font-weight="400">One causal content/time/address/state interface; different compatible programs and mixtures in each region.</text>
<g class=""><rect x="35" y="115" width="1130" height="112" rx="12" fill="white" stroke="#2259a7" stroke-width="2"/>
<text x="49" y="142" font-family="Arial, sans-serif" font-size="17" fill="#2259a7" font-weight="700">Keep three scales in view</text>
<text x="49" y="168" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Family envelope: admissible choices → member: specified operators/contracts → target: integrated temporal selection</text>
<text x="49" y="191" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Common review axes: computational power + total work; represented distinctions; useful learning.</text>
<text x="49" y="214" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Implemented branches illustrate choices. Their union is not a completed trained system.</text>
</g>
<g class=""><rect x="35" y="275" width="330" height="110" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="302" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Atoms → units</text>
</g>
<g class=""><rect x="410" y="275" width="755" height="110" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="424" y="302" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Design choices + composition contract</text>
<text x="424" y="328" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Choose evidence + flow + writes + reception + output + credit.</text>
<text x="424" y="351" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Preserve content, timing, state and the relevant event history.</text>
</g>
<polyline class="" points="365,330 410,330" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-8bb1f248)"/>
<polyline class="" points="200,385 200,440" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-8bb1f248)"/>
<g class=""><rect x="35" y="440" width="330" height="110" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="467" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Modules → layers → stacks</text>
</g>
<g class=""><rect x="410" y="440" width="755" height="110" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="424" y="467" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Design choices + composition contract</text>
<text x="424" y="493" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Compose access, deliveries, mixing, joins, depth and recurrence.</text>
<text x="424" y="516" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Preserve required information paths and usable credit through boundaries.</text>
</g>
<polyline class="" points="365,495 410,495" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-8bb1f248)"/>
<polyline class="" points="200,550 200,605" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-8bb1f248)"/>
<g class=""><rect x="35" y="605" width="330" height="110" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="49" y="632" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Compositions → complete system</text>
</g>
<g class=""><rect x="410" y="605" width="755" height="110" rx="12" fill="white" stroke="#147d69" stroke-width="2"/>
<text x="424" y="632" font-family="Arial, sans-serif" font-size="17" fill="#147d69" font-weight="700">Design choices + composition contract</text>
<text x="424" y="658" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Combine statistics, retrieval, rich islands, online learning and serving.</text>
<text x="424" y="681" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Specify shared state, causal queries, versions, termination and full work.</text>
</g>
<polyline class="" points="365,660 410,660" fill="none" stroke="#147d69" stroke-width="2.3" stroke-dasharray="0" marker-end="url(#arrow-8bb1f248)"/>
<text x="35" y="800" font-family="Arial, sans-serif" font-size="19" fill="#ad5b16" font-weight="700">Adaptive replacement or growth needs a declared preservation contract:</text>
<g class=""><rect x="35" y="835" width="360" height="110" rx="12" fill="white" stroke="#ad5b16" stroke-width="2"/>
<text x="49" y="862" font-family="Arial, sans-serif" font-size="17" fill="#ad5b16" font-weight="700">Forward continuation</text>
<text x="49" y="888" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Future outputs / emissions / state</text>
<text x="49" y="911" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Keep clocks and pending deadlines.</text>
</g>
<g class=""><rect x="420" y="835" width="360" height="110" rx="12" fill="white" stroke="#ad5b16" stroke-width="2"/>
<text x="434" y="862" font-family="Arial, sans-serif" font-size="17" fill="#ad5b16" font-weight="700">Learning transition</text>
<text x="434" y="888" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Credit + parameter / optimizer state</text>
<text x="434" y="911" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Equal outputs can learn differently.</text>
</g>
<g class=""><rect x="805" y="835" width="360" height="110" rx="12" fill="white" stroke="#ad5b16" stroke-width="2"/>
<text x="819" y="862" font-family="Arial, sans-serif" font-size="17" fill="#ad5b16" font-weight="700">Resource refinement</text>
<text x="819" y="888" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Work / memory / traffic / latency</text>
<text x="819" y="911" font-family="Arial, sans-serif" font-size="15" fill="#25354b" font-weight="400">Ignored branches may still cost work.</text>
</g>
<text x="35" y="985" font-family="Arial, sans-serif" font-size="15" fill="#5a6779" font-weight="400">Expand the limiting region; retain economical regions. Test the integrated consequence rather than counting features.</text>
</svg>
